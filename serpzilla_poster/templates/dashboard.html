<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpzilla SEO Guest Post Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-400">Serpzilla Guest Post Automator</h1>
                <p class="text-gray-400 text-sm mt-1">Automated SEO content generation & placement via Google Gemini & Serpzilla REST API</p>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                ● System Online
            </span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Submit Task Form -->
            <div class="lg:col-span-1 bg-gray-800/60 p-6 rounded-xl border border-gray-700/60 shadow-lg">
                <h2 class="text-xl font-semibold text-gray-200 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Guest Post Task
                </h2>
                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Project ID</label>
                        <input type="number" name="project_id" required placeholder="e.g. 102938" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Site ID</label>
                        <input type="number" name="site_id" required placeholder="e.g. 54321" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Target URL</label>
                        <input type="url" name="target_url" required placeholder="https://example.com/target-page" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Anchor Text</label>
                        <input type="text" name="anchor_text" required placeholder="best SEO tools 2026" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 uppercase tracking-wider mb-1">Article Topic</label>
                        <textarea name="topic" rows="3" required placeholder="Top strategies to scale organic search rankings in 2026" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white resize-none"></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-md flex justify-center items-center gap-2">
                        <span>Launch Automated Pipeline</span>
                    </button>
                </form>
                <div id="form-msg" class="mt-3 text-xs hidden"></div>
            </div>

            <!-- Task Execution Table -->
            <div class="lg:col-span-2 bg-gray-800/60 p-6 rounded-xl border border-gray-700/60 shadow-lg flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-200">Execution Pipeline Logs</h2>
                    <button onclick="loadTasks()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-gray-300 transition-colors">↻ Refresh</button>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="border-b border-gray-700 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                <th class="py-3 px-3">ID</th>
                                <th class="py-3 px-3">Project/Site</th>
                                <th class="py-3 px-3">Topic & Anchor</th>
                                <th class="py-3 px-3">Status</th>
                                <th class="py-3 px-3">Article / Placement ID</th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body" class="divide-y divide-gray-700/50 text-gray-300">
                            <tr><td colspan="5" class="text-center py-6 text-gray-500">Loading tasks...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusBadges = {
            'pending': 'bg-yellow-950 text-yellow-400 border-yellow-800',
            'generated': 'bg-blue-950 text-blue-400 border-blue-800',
            'content_uploaded': 'bg-indigo-950 text-indigo-400 border-indigo-800',
            'placed': 'bg-emerald-950 text-emerald-400 border-emerald-800',
            'failed': 'bg-rose-950 text-rose-400 border-rose-800'
        };

        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                const tbody = document.getElementById('task-table-body');
                if (tasks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">No tasks created yet. Use the form to start one!</td></tr>`;
                    return;
                }
                tbody.innerHTML = tasks.map(t => `
                    <tr class="hover:bg-gray-700/30 transition-colors">
                        <td class="py-3 px-3 font-mono text-xs text-gray-400">#${t.id}</td>
                        <td class="py-3 px-3 font-mono text-xs">
                            <span class="text-indigo-300">P:${t.project_id}</span> / 
                            <span class="text-gray-400">S:${t.site_id}</span>
                        </td>
                        <td class="py-3 px-3">
                            <div class="font-medium text-gray-200 truncate max-w-xs">${t.topic}</div>
                            <div class="text-xs text-indigo-400 font-mono"><a href="${t.target_url}" target="_blank" class="hover:underline">${t.anchor_text}</a></div>
                        </td>
                        <td class="py-3 px-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${statusBadges[t.status] || 'bg-gray-700 text-gray-300'}">
                                ${t.status}
                            </span>
                            ${t.error_message ? `<div class="text-xs text-rose-400 mt-1 max-w-xs truncate" title="${t.error_message}">${t.error_message}</div>` : ''}
                        </td>
                        <td class="py-3 px-3 font-mono text-xs">
                            ${t.article_id ? `Art: #${t.article_id}` : '-'} <br/>
                            ${t.placement_id ? `<span class="text-emerald-400">Plc: #${t.placement_id}</span>` : '-'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load tasks:', err);
            }
        }

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('form-msg');
            btn.disabled = true;
            btn.innerHTML = '<span>Enqueuing...</span>';
            
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/process-task', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = 'mt-3 text-xs text-emerald-400 block';
                    msg.textContent = `Task #${data.task_id} successfully queued!`;
                    e.target.reset();
                    loadTasks();
                } else {
                    msg.className = 'mt-3 text-xs text-rose-400 block';
                    msg.textContent = data.detail || 'Failed to submit task';
                }
            } catch (err) {
                msg.className = 'mt-3 text-xs text-rose-400 block';
                msg.textContent = 'Error connecting to server';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Launch Automated Pipeline</span>';
            }
        });

        loadTasks();
        setInterval(loadTasks, 4000);
    </script>
</body>
</html>
